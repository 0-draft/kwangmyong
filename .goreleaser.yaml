version: 2

before:
  hooks:
    - go mod tidy -diff

builds:
  - main: ./cmd/kwangmyong
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - README.ja.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# cosign 3.x writes one Sigstore bundle (signature + certificate) per artifact.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum
    output: true

changelog:
  use: github-native
