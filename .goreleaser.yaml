version: 2

before:
  hooks:
    - go mod tidy -diff

builds:
  - main: ./cmd/kwangmyong
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - README.ja.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# cosign 3.x writes one Sigstore bundle (signature + certificate) per artifact.
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]
    artifacts: checksum
    output: true

changelog:
  use: github-native

homebrew_casks:
  - name: kwangmyong
    binaries: [kwangmyong]
    # Without the tap token (forks, or before it is set) the release still ships.
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}auto{{ else }}true{{ end }}'
    # Casks are downloaded with curl, so the binary carries com.apple.quarantine
    # and Gatekeeper refuses to run it unsigned.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/kwangmyong"]
        end
      end
    homepage: "https://github.com/kanywst/kwangmyong"
    description: "Find your own identity leaking from git repositories and GitHub"
    repository:
      owner: kanywst
      name: homebrew-tap
      branch: main
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'
    directory: Casks
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "chore(cask): {{ .ProjectName }} {{ .Tag }}"
