name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go mod tidy is clean
        run: go mod tidy -diff
      - name: build
        run: go build ./...
      - name: cross-compile
        run: |
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} go build -o /dev/null ./cmd/kwangmyong
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: test
        if: runner.os != 'Windows'
        run: go test -race -coverprofile=coverage.out ./...
      - name: test (windows, no race)
        if: runner.os == 'Windows'
        run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod

  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: kwangmyong scans itself
        run: go run ./cmd/kwangmyong scan --history --strict .

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build the demo repositories
        env:
          GIT_AUTHOR_NAME: ci
          GIT_AUTHOR_EMAIL: ci@example.com
          GIT_COMMITTER_NAME: ci
          GIT_COMMITTER_EMAIL: ci@example.com
        run: docs/demo/setup.sh "$GITHUB_WORKSPACE/.demo"
      - name: A clean repository passes
        uses: ./
        with:
          version: source
          identity: ${{ env.DEMO_IDENTITY }}
          args: scan --history --strict .demo/clean
      - name: A leaking repository fails
        id: exposed
        continue-on-error: true
        uses: ./
        with:
          version: source
          identity: ${{ env.DEMO_IDENTITY }}
          args: scan --history --strict .demo/repo
          sarif: exposed.sarif
      - name: It failed, and the SARIF is masked
        env:
          OUTCOME: ${{ steps.exposed.outcome }}
        run: |
          test "$OUTCOME" = failure
          test "$(jq '.runs[0].results | length' exposed.sarif)" -ge 6
          ! grep -q -e tyamada -e Taros-MacBook exposed.sarif
    env:
      DEMO_IDENTITY: |
        names  = ["Taro Yamada", "山田 太郎"]
        logins = ["tyamada"]
        hosts  = ["Taros-MacBook-Pro"]
