- id: kwangmyong
  name: kwangmyong (identity leaks in the staged diff)
  description: Block commits that would publish your real name, login, personal email, hostname or home paths.
  entry: kwangmyong hook pre-commit
  language: golang
  pass_filenames: false
  always_run: true
  stages: [pre-commit]
- id: kwangmyong-pre-push
  name: kwangmyong (identity leaks in pushed commits)
  description: Block pushes whose commits carry your identity in metadata or contents.
  entry: kwangmyong hook pre-push
  language: golang
  pass_filenames: false
  always_run: true
  stages: [pre-push]
- id: kwangmyong-commit-msg
  name: kwangmyong (identity leaks in the commit message)
  description: Block commit messages that carry your identity or an agent session link.
  entry: kwangmyong hook commit-msg
  language: golang
  pass_filenames: true
  always_run: true
  stages: [commit-msg]
